name: Harbour
options:
  bundleIdPrefix: com.maverickd650
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Harbour:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Harbour
    info:
      path: Harbour/Generated/Info.plist
      properties:
        CFBundleDisplayName: Harbour
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maverickd650.harbour
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Harbour:
    build:
      targets:
        Harbour: all
    run:
      config: Debug
